[package]
name = "vds-capi"
description = "C ABI of libvds (include/vds.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "vds"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# H.264 on the GPU through VA-API (Linux), see vds-encode.
vaapi = ["vds-rdp/vaapi"]

[dependencies]
vds-core.workspace = true
vds-rdp.workspace = true
vds-encode.workspace = true
tracing.workspace = true
parking_lot.workspace = true

[lints]
workspace = true

# `cargo deb -p vds-capi` builds libvds0, `cargo deb -p vds-capi --variant dev` builds
# libvds-dev. The SONAME (build.rs) is libvds.so.0; vds-1.pc's Version follows the
# workspace version.
[package.metadata.deb]
name = "libvds0"
maintainer = "Lierfang Support Team <itsupport@lierfang.com>"
copyright = "Lierfang"
section = "libs"
priority = "optional"
depends = "libc6, libgcc-s1, libstdc++6, zlib1g"
extended-description = "libvds is the in-process remote display server (RDP) used by QEMU's -rdp option."
triggers-file = "debian/triggers"
assets = [
    ["target/release/libvds.so", "usr/lib/libvds.so.0", "644"],
]

[package.metadata.deb.variants.dev]
name = "libvds-dev"
section = "libdevel"
depends = "libvds0"
extended-description = "Header and pkg-config file to build programs (QEMU) against libvds."
assets = [
    ["../../include/vds.h", "usr/include/", "644"],
    ["debian/vds-1.pc", "usr/lib/pkgconfig/", "644"],
    { dest = "usr/lib/libvds.so", link_name = "libvds.so.0" },
]
