language = "C"
include_guard = "VDS_H"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
documentation = true
documentation_style = "c"
style = "type"
usize_is_size_t = true
header = """/*
 * libvds C ABI. Generated by cbindgen from crates/vds-capi: do not edit.
 * Regenerate with `cargo run -p xtask -- gen-abi` (see docs/spec/c-abi.md).
 *
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */"""

[export]
include = ["VdsConfig", "VdsCallbacks", "VdsLogConfig", "VdsRect", "VdsMonitor", "VdsClientInfo"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
